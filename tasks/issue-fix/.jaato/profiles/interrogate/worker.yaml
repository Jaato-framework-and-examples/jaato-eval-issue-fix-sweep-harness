# The profile a FINISHED arm is revived under when you want to ASK it something.
#
# Select with JAATO_PROFILE_SET=interrogate.  A profile set is a subdirectory of
# profiles/ scanned FIRST, winning on name collision, so this shadows the
# sweep's `worker` without touching it.
#
# IT INHERITS, and overrides only the completion schema.  The earlier version
# of this file declared everything from scratch to avoid the schema, and
# silently dropped every other thing the base carries — including
# `budget_control`, which meant an interrogation ran with NO cost ceiling at
# all.  Inheriting keeps budget_control, max_turns, runtime_limits, env and
# plugin_configs; only the schema is replaced.
#
# `completion_payload_schema: {}` is an override, not a removal.  A declared
# schema — even an empty one — is what exposes `signal_completion`
# (lifecycle_tools._should_hide_signal_completion), so the session stays
# MULTI-TURN and can be asked to run a command, read a file, or make a change.
# Removing the schema entirely would give the session exactly one turn: it ends
# as soon as the model returns text with no tool call, which answers a question
# and is useless for anything else.  (`null` does not work — it reads as "not
# set" and the parent's schema is inherited.)
#
# RESIDUAL (jaato #791), and you must know it: the base's
# `completion_processors` CANNOT be cleared here.  Inheritance concatenates parent then child by design
# (subagent/config.py:2061, "each processor is independent and all fire"), so
# the acceptance processor still runs when the arm calls signal_completion:
#
#   interrogating an arm that PASSED  -> the processor re-runs acceptance, it
#                                        passes, completion stands.  No effect.
#   interrogating an arm that FAILED  -> the processor refuses and hands the
#                                        arm its failures, so it will try to
#                                        FIX them instead of only answering.
#
# For a pure question to a failing arm, expect that and say so in the question,
# or accept the arm will work rather than only explain.
name: worker
inherits: [_base_worker]
provider: openrouter

# Required key.  Empty means "add nothing to the inherited set" — the base's
# six plugins come through, since inheritance UNIONs this field.
plugins: []

# The override this profile exists for.
completion_payload_schema: {}

# No model on purpose: a revived session keeps the model it ran under, and
# naming one here would answer a question about model A using model B.
